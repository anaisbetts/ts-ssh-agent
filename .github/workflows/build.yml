name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Cross-compile
        env:
          CGO_ENABLED: "0"
          TARGETS: linux/amd64 windows/amd64 windows/arm64
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in $TARGETS; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            out="dist/ts-ssh-agent-${GOOS}-${GOARCH}${ext}"
            echo "::group::$target"
            go vet ./...
            go build -trimpath -ldflags="-s -w" -o "$out" ./cmd/ts-ssh-agent
            echo "::endgroup::"
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: ts-ssh-agent
          path: dist/*
          if-no-files-found: error

  # Releases are created by a person (UI or `gh release create`); releases made
  # with GITHUB_TOKEN wouldn't trigger the `release` event for the docker job.
  release-binaries:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ts-ssh-agent
          path: dist

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  docker:
    needs: build
    # Images: `main` on default branch; version tag + `latest` when a GitHub Release is published.
    if: success() && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
